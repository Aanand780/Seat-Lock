version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: seatlock-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: seatlock
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d seatlock"]
      interval: 3s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: seatlock-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/seatlock
      SESSION_SECRET: seatlock-secure-session-key-32chars-min
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
