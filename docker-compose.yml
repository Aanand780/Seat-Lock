version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: seatlock_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: seatlock
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./scripts/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d seatlock"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: seatlock_app
    restart: always
    environment:
      PORT: 3000
      NODE_ENV: production
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: seatlock
      PGUSER: postgres
      PGPASSWORD: postgrespassword
      SESSION_SECRET: seatlock-super-secure-production-secret-key-32chars
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
